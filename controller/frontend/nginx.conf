# Plain HTTP (:80, mapped to host :8080) serves only localhost visitors and
# /ca.crt. Every other visit is redirected to TLS (:443, mapped to host
# :8445 -see docker-compose.yml's comment: the usual :8443 collides with
# another project on this host). Before 2026-11-09 only the intercom client
# was redirected, so a console login from another machine sent the admin
# password in clear text (security review, quick fix 4).
#
# /ws proxies pbx-core's SIP-over-WebSocket listener (plain ws://, port
# 8188 -not the standard 8088, which also collides with another project on
# this host, see pbx-core/entrypoint.sh's comment -network_mode: host,
# reached at the host's LAN IP: __PBX_HOST__ is filled in from PBX_HOST by
# entrypoint.sh. Not host.containers.internal: under podman 5.x + pasta that
# resolves to 169.254.1.2, which doesn't reach host-network services
# (refused on 8188, timed out on 9080; confirmed 2026-10-17)) through this same nginx, at the same origin as
# the page. The intercom client derives its own wss://<host>/ws (or ws://
# over plain HTTP) from window.location -see intercom-client/src/sipUa.ts
# -rather than being handed a separate host/port.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Everything except localhost visits and the CA download goes to HTTPS.
    # 302, not 301, so browsers don't cache it permanently. __HTTPS_PORT__ is
    # the HOST-side port (docker-compose.yml), filled in by entrypoint.sh.
    set $to_https 1;
    if ($host ~* ^(localhost|127\.0\.0\.1|\[::1\])$) {
        set $to_https 0;
    }
    if ($uri = /ca.crt) {
        set $to_https 0;
    }
    if ($to_https) {
        return 302 https://$host:__HTTPS_PORT__$request_uri;
    }

    location /api/v1 {
        proxy_pass http://controller-backend:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws {
        proxy_pass http://__PBX_HOST__:8188;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Bare /intercom-client (no trailing slash) would otherwise fall through
    # to the console SPA fallback below and silently serve the console's
    # login form instead -nginx prefix matching on /intercom-client/
    # requires the trailing slash. Redirect to the slashed form so it always
    # hits the intercom client app.
    # The local CA's PUBLIC cert (see entrypoint.sh) -install + trust it on a
    # device (iPad: open http://<host>:8080/ca.crt, install the profile, then
    # Settings > General > About > Certificate Trust Settings) so both the
    # page and the wss:// SIP line are trusted. Served on plain HTTP too on
    # purpose: you can't use HTTPS cleanly before trusting the CA.
    location = /ca.crt {
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="parley-ca.crt"';
        alias /usr/share/nginx/ca.crt;
    }

    location = /intercom-client {
        return 301 /intercom-client/;
    }

    # Intercom client app (built into /usr/share/nginx/html/intercom-client
    # by the Containerfile's second build stage) -a separate,
    # unauthenticated-by-default page, not part of the JWT-gated console SPA
    # below.
    #
    # Over plain HTTP the client only works on localhost anyway: elsewhere
    # the page isn't a secure context and the browser hides getUserMedia (an
    # iPad on http://<lan-ip>:8080 hit exactly this, 2026-10-17). The
    # server-level redirect above sends those visitors to HTTPS.
    location /intercom-client/ {
        # index.html must never be served stale: after a deploy it names
        # the new content-hashed bundle. An iPad kept running a pre-fix
        # bundle through a redeploy without ever re-fetching the page
        # (2026-10-17). Hashed assets below are safe to cache.
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /intercom-client/index.html;
    }

    location /intercom-client/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback (console)
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}

server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;

    location /api/v1 {
        proxy_pass http://controller-backend:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws {
        proxy_pass http://__PBX_HOST__:8188;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # The local CA's PUBLIC cert (see entrypoint.sh) -install + trust it on a
    # device (iPad: open http://<host>:8080/ca.crt, install the profile, then
    # Settings > General > About > Certificate Trust Settings) so both the
    # page and the wss:// SIP line are trusted. Served on plain HTTP too on
    # purpose: you can't use HTTPS cleanly before trusting the CA.
    location = /ca.crt {
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="parley-ca.crt"';
        alias /usr/share/nginx/ca.crt;
    }

    location = /intercom-client {
        return 301 /intercom-client/;
    }

    location /intercom-client/ {
        # index.html must never be served stale: after a deploy it names
        # the new content-hashed bundle. An iPad kept running a pre-fix
        # bundle through a redeploy without ever re-fetching the page
        # (2026-10-17). Hashed assets below are safe to cache.
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /intercom-client/index.html;
    }

    location /intercom-client/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
