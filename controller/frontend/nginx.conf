# Both plain HTTP (:80, mapped to host :8080) and TLS (:443, mapped to
# host :8445 in this compose file -see docker-compose.yml's comment: the
# usual :8443 collides with another project on this host) serve identically
# -no forced redirect, so the existing localhost:8080 workflow keeps working
# unchanged. HTTPS is additive, for a genuinely remote desk machine
# (getUserMedia needs a secure context there; localhost is browser-exempted
# from that requirement, which is why plain HTTP has always been fine for
# local use).
#
# /ws proxies pbx-core's SIP-over-WebSocket listener (plain ws://, port
# 8188 -not the standard 8088, which also collides with another project on
# this host, see pbx-core/entrypoint.sh's comment -network_mode: host,
# reached at the host's LAN IP: __PBX_HOST__ is filled in from PBX_HOST by
# entrypoint.sh. Not host.containers.internal: under podman 5.x + pasta that
# resolves to 169.254.1.2, which doesn't reach host-network services
# (refused on 8188, timed out on 9080; confirmed 2026-10-17)) through this same nginx, at the same origin as
# the page. The intercom client derives its own wss://<host>/ws (or ws://
# over plain HTTP) from window.location -see intercom-client/src/sipUa.ts
# -rather than being handed a separate host/port.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/v1 {
        proxy_pass http://controller-backend:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws {
        proxy_pass http://__PBX_HOST__:8188;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Bare /intercom-client (no trailing slash) would otherwise fall through
    # to the console SPA fallback below and silently serve the console's
    # login form instead -nginx prefix matching on /intercom-client/
    # requires the trailing slash. Redirect to the slashed form so it always
    # hits the intercom client app.
    location = /intercom-client {
        return 301 /intercom-client/;
    }

    # Intercom client app (built into /usr/share/nginx/html/intercom-client
    # by the Containerfile's second build stage) -a separate,
    # unauthenticated-by-default page, not part of the JWT-gated console SPA
    # below.
    location /intercom-client/ {
        try_files $uri $uri/ /intercom-client/index.html;
    }

    # SPA fallback (console)
    location / {
        try_files $uri /index.html;
    }
}

server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;

    location /api/v1 {
        proxy_pass http://controller-backend:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws {
        proxy_pass http://__PBX_HOST__:8188;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location = /intercom-client {
        return 301 /intercom-client/;
    }

    location /intercom-client/ {
        try_files $uri $uri/ /intercom-client/index.html;
    }

    location / {
        try_files $uri /index.html;
    }
}
