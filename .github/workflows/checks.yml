# Secret scan and dependency audit on every push and pull request (#39),
# plus a typecheck of each package since it's cheap.
name: checks
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (whole history)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 git /repo --no-banner --redact -v

  packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [controller/backend, controller/frontend, intercom-client, pbx-core, transcriber]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci
      - name: npm audit (production dependencies, high and above)
        run: npm audit --omit=dev --audit-level=high
      - name: typecheck
        run: npx tsc --noEmit -p .
