# Parley -full stack for podman-compose (or docker-compose).
#
#   podman-compose up -d --build
#
# Layout:
#   postgres            -controller's database (users, audit, endpoints, groups, sessions)
#   controller-backend   -REST API: auth, endpoint registry, health polling, session orchestration
#   controller-frontend  -patch-bay UI (nginx, proxies /api/v1 to controller-backend)
#   pbx-core             -drachtio SIP registrar/B2BUA (your custom TS routing logic)
#   rtpengine            -media anchor/relay (plain RTP; see pbx-core/src/rtpengine.ts)
#   freeswitch           -group open-mic mixer (mod_conference), pure media resource
#
# pbx-core, rtpengine, and freeswitch all run with host networking -required
# for the routed/multi-subnet deployment (endpoints on other subnets need a
# reachable media anchor, not NAT'd container IPs). Set RTPENGINE_PUBLIC_IP
# below to this host's routed/LAN IP before starting.

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: parley-postgres
    environment:
      POSTGRES_DB:       ${PGDATABASE:-intercom}
      POSTGRES_USER:     ${PGUSER:-intercom_user}
      POSTGRES_PASSWORD: ${PGPASSWORD:?set PGPASSWORD in .env}
    volumes:
      - parley-pgdata:/var/lib/postgresql/data
    # Loopback only: pbx-core and the transcriber (host networking) reach it
    # at 127.0.0.1:5433; controller-backend uses the compose network. Host
    # 5433 avoids clashing with any local Postgres.
    ports:
      - "127.0.0.1:5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-intercom_user} -d ${PGDATABASE:-intercom}"]
      interval: 5s
      timeout: 3s
      retries: 10

  controller-backend:
    build:
      context: .
      dockerfile: controller/backend/Containerfile
    container_name: parley-controller-backend
    # The image has no USER; run as its built-in `node` user (uid 1000).
    # keep-id maps it to the host user, who owns the parley-archives volume
    # (podman-compose doesn't apply :U to it). No podman socket here any more
    # (#37): the Health page's logs come from log-reader, so no label:disable.
    userns_mode: keep-id
    user: "1000:1000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT:            "3100"
      NODE_ENV:         production
      JWT_SECRET:       ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_TTL:          "8h"
      ADMIN_EMAIL:      ${ADMIN_EMAIL:-admin@intercom.local}
      ADMIN_PASSWORD:   ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      CORS_ORIGIN:      ${CORS_ORIGIN:-}   # empty = same-origin only (see config.ts)
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env}
      PGHOST:           postgres
      PGPORT:           "5432"
      PGDATABASE:       ${PGDATABASE:-intercom}
      PGUSER:           ${PGUSER:-intercom_user}
      PGPASSWORD:       ${PGPASSWORD:?set PGPASSWORD in .env}
      HEALTH_INTERVAL_MS: "30000"
      # Demo data (controller/backend/src/services/demoSeedService.ts): a
      # broadcast crew on 2001-2008 plus five talk groups. Off by default;
      # additive and idempotent when on.
      SEED_DEMO:        ${SEED_DEMO:-false}
      DEMO_PASSWORD:    ${DEMO_PASSWORD:-demo1234}
      # pbx-core's read-only admin/status HTTP server (registrations + live
      # calls, for the console's "Live" view). pbx-core runs network_mode:
      # host; controller-backend is bridge-networked, so it reaches the host
      # at its LAN IP. Not host.containers.internal: under podman 5.x + pasta
      # that resolves to 169.254.1.2, which doesn't reach host-network
      # services (timed out on 9080, confirmed 2026-10-17).
      PBX_BASE_URL:     "http://${RTPENGINE_PUBLIC_IP:?set RTPENGINE_PUBLIC_IP in .env to this host's routed/LAN IP}:9080"
      # The transcriber's who's-talking endpoint (host network, like pbx-core).
      TRANSCRIBER_URL:  "http://${RTPENGINE_PUBLIC_IP:?set RTPENGINE_PUBLIC_IP in .env to this host's routed/LAN IP}:9081"
      # The Health page's container logs, from log-reader (#37).
      LOG_READER_URL: http://log-reader:9300
      # Archives (the Backups archive and transcripts/chat before deletion,
      # #28) are written under this folder, on the parley-archives volume.
      LOCAL_ARCHIVE_DIR: /var/lib/parley/archive
      # Shift summaries (#29): the shared Ollama on the host.
      OLLAMA_URL:       ${OLLAMA_URL:-http://host.containers.internal:11434}
      OLLAMA_MODEL:     ${OLLAMA_MODEL:-qwen2.5:7b}
    volumes:
      # :U so the container's user (uid 1000) owns a new volume.
      - parley-archives:/var/lib/parley/archive:U
    # Loopback only (security review 2026-11-09, C2): browsers reach the API
    # through nginx's /api/v1.
    ports:
      - "127.0.0.1:3100:3100"
    restart: unless-stopped

  # The only container with the podman API socket (#37). It answers one
  # request: the last N log lines of one of Parley's own containers, for a
  # caller with INTERNAL_API_TOKEN. Not published on any host port; only
  # controller-backend calls it, over the compose network.
  log-reader:
    build:
      context: .
      dockerfile: log-reader/Containerfile
    container_name: parley-log-reader
    # Rootless podman maps container root to a subordinate host UID, which
    # gets EACCES on the socket (owned by the host user, mode 0660).
    # keep-id + uid 1000 makes this container's user the socket's owner.
    userns_mode: keep-id
    user: "1000:1000"
    # SELinux denies container_t `connectto` on the socket's
    # container_runtime_t label whatever the booleans or :Z say, so this one
    # small container runs unconfined; everything else stays confined.
    security_opt:
      - label:disable
    environment:
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env}
    volumes:
      # Rootless podman's socket for uid 1000; needs `systemctl --user enable
      # --now podman.socket` on the host.
      - /run/user/1000/podman/podman.sock:/run/podman/podman.sock:Z
    restart: unless-stopped

  controller-frontend:
    build:
      context: .
      dockerfile: controller/frontend/Containerfile
    container_name: parley-controller-frontend
    depends_on:
      - controller-backend
    environment:
      # SAN entry for the self-signed TLS cert entrypoint.sh generates on
      # first start (see /etc/nginx/tls, a persisted volume below) -reuses
      # the same "this host's routed/LAN IP" value everything else in this
      # stack already uses, rather than a new env var.
      CERT_SAN_IP: ${RTPENGINE_PUBLIC_IP:?set RTPENGINE_PUBLIC_IP in .env to this host's routed/LAN IP}
      # nginx.conf's /ws proxy target (pbx-core, host networking) -see
      # entrypoint.sh.
      PBX_HOST: ${RTPENGINE_PUBLIC_IP:?set RTPENGINE_PUBLIC_IP in .env to this host's routed/LAN IP}
      # Host-side HTTPS port (must match the "<this>:443" mapping below) -for
      # nginx's redirect of non-localhost /intercom-client/ visits to HTTPS.
      HTTPS_PORT: "8445"
    volumes:
      - parley-tls-certs:/etc/nginx/tls
    ports:
      - "8080:80"
      # Host 8443 is taken on this machine by callowl-frontend and 8444 by
      # callnest-frontend (8446 is Open Turret's) -mapped to 8445 here
      # instead; the container's own nginx still listens on 443 internally,
      # only the host-side mapping changed.
      - "8445:443"
    restart: unless-stopped

  pbx-core:
    build:
      context: ./pbx-core
      dockerfile: Containerfile
    container_name: parley-pbx-core
    network_mode: host   # required for reachable media anchoring across subnets
    environment:
      DRACHTIO_HOST:   "127.0.0.1"
      DRACHTIO_PORT:   "9022"
      DRACHTIO_SECRET: ${DRACHTIO_SECRET:?set DRACHTIO_SECRET in .env}
      # Bearer token for /status (admin.ts) and the transcriber poke.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env}
      # rtpengine's control address; see images/rtpengine/entrypoint.sh
      # (set RTPENGINE_NG_HOST=10.255.255.254 under WSL2 mirrored networking).
      RTPENGINE_HOST:  ${RTPENGINE_NG_HOST:-127.0.0.1}
      RTPENGINE_PORT:  "22222"
      GROUP_PREFIX:    "*8"
      # FreeSWITCH's "intercom" sip_profile binds sip-ip/rtp-ip to
      # $${local_ip_v4} (its own detected LAN IP), NOT loopback -unlike
      # rtpengine's ng control port, which is intentionally 127.0.0.1-only.
      # 127.0.0.1 here was a dormant bug: nothing was listening there, so
      # every group call's B2BUA to FreeSWITCH failed immediately (never
      # caught because group calls had never been boot-tested before).
      FREESWITCH_HOST: ${RTPENGINE_PUBLIC_IP:?set RTPENGINE_PUBLIC_IP in .env to this host's routed/LAN IP}
      FREESWITCH_PORT: "5080"
      # pbx-core's own routable SIP address, used as the Contact on legs it
      # originates -FreeSWITCH sends its BYEs there (see config.ts ownContact).
      PBX_SIP_HOST:    ${RTPENGINE_PUBLIC_IP:?set RTPENGINE_PUBLIC_IP in .env to this host's routed/LAN IP}
      PBX_SIP_PORT:    "5063"
      # Optional debug namespaces for pbx-core's Node libraries, e.g.
      # PBX_DEBUG=drachtio:srf in .env or the shell. Empty = off.
      DEBUG:           ${PBX_DEBUG:-}
      # SIP digest auth (see digestAuth.ts/db.ts) -a read-only lookup of
      # directory_users.sip_ha1, the one deliberate exception to pbx-core
      # otherwise being database-free. pbx-core runs network_mode: host (no
      # compose-network DNS), so PGHOST/PGPORT point at postgres's
      # HOST-published port (5433, see that service's `ports:`), not the
      # in-cluster 5432 controller-backend uses via the "postgres" service
      # name.
      PGHOST:     "127.0.0.1"
      PGPORT:     "5433"
      PGDATABASE: ${PGDATABASE:-intercom}
      PGUSER:     ${PGUSER:-intercom_user}
      PGPASSWORD: ${PGPASSWORD:?set PGPASSWORD in .env}
    depends_on:
      - rtpengine
      - freeswitch
      - postgres
    restart: unless-stopped

  rtpengine:
    build:
      context: ./images/rtpengine
      dockerfile: Containerfile
    container_name: parley-rtpengine
    network_mode: host   # anchors media on the host's routed interface
    environment:
      RTPENGINE_PUBLIC_IP: ${RTPENGINE_PUBLIC_IP:?set RTPENGINE_PUBLIC_IP in .env to this host's routed/LAN IP}
      RTPENGINE_NG_HOST:   ${RTPENGINE_NG_HOST:-127.0.0.1}
      RTPENGINE_NG_PORT:   "22222"
      RTPENGINE_PORT_MIN:  "30000"
      RTPENGINE_PORT_MAX:  "40000"
    restart: unless-stopped

  # Group open-mic mixer. Pure media resource: pbx-core B2BUAs a group call
  # here (see pbx-core/src/groups.ts); FreeSWITCH's own dialplan
  # (images/freeswitch/dialplan/intercom.xml) answers and joins mod_conference.
  # No ESL/ctrl-channel wiring -PTT mute happens at the SIP endpoint instead.
  # NB: built from drachtio/drachtio-freeswitch-base; not boot-tested against
  # the current base tag here, so check `podman logs parley-freeswitch` and
  # `podman exec -ti parley-freeswitch /usr/local/freeswitch/bin/fs_cli -x "sofia status"`
  # on first start.
  freeswitch:
    build:
      context: ./images/freeswitch
      dockerfile: Containerfile
    container_name: parley-freeswitch
    network_mode: host   # RTP must be directly reachable for the routed/
                          # multi-subnet case; the "intercom" sip_profile
                          # binds to FREESWITCH_BIND_IP below, NOT loopback.
    environment:
      # Must match FREESWITCH_HOST (pbx-core service, below) exactly -pbx-
      # core dials the group-call B2BUA at that address, so FreeSWITCH must
      # actually be listening there. Explicit on purpose, not auto-detected:
      # on a multi-homed host (>1 NIC on the same subnet), FreeSWITCH's own
      # $${local_ip_v4} guess picked a different interface than this one,
      # and every group call failed with a SIP 503 (nothing listening at
      # the address pbx-core actually tried) -see entrypoint.sh.
      FREESWITCH_BIND_IP: ${RTPENGINE_PUBLIC_IP:?set RTPENGINE_PUBLIC_IP in .env to this host's routed/LAN IP}
    restart: unless-stopped

  # Live per-group transcription (groups with "Transcribe" on in the
  # console). Taps each member's own voice from rtpengine (subscribe
  # request), segments it on pauses and sends it to a whisper.cpp
  # whisper-server, storing attributed lines for the intercom client's
  # transcript panel. Idle cost is one small poll loop. WHISPER_URL defaults
  # to the shared instance on this host (CallNest's callnest-whisper) -never
  # start a second model server here.
  transcriber:
    build:
      context: ./transcriber
      dockerfile: Containerfile
    container_name: parley-transcriber
    network_mode: host   # receives RTP from rtpengine on local ports; reaches pbx-core/rtpengine/whisper on this host
    environment:
      PBX_STATUS_URL: "http://127.0.0.1:9080/status"
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env}
      RTPENGINE_HOST: ${RTPENGINE_NG_HOST:-127.0.0.1}
      RTPENGINE_PORT: "22222"
      MEDIA_IP:       ${RTPENGINE_PUBLIC_IP:?set RTPENGINE_PUBLIC_IP in .env to this host's routed/LAN IP}
      WHISPER_URL:    ${WHISPER_URL:-http://127.0.0.1:8090}
      TALKING_PORT:   "9081"   # GET /talking -who's speaking now, for controller-backend
      # Set to keep every segment sent to whisper (WAV + verdict) under that
      # path inside the container, for tracing odd transcript lines.
      TRANSCRIPT_DEBUG_DIR: ${TRANSCRIPT_DEBUG_DIR:-}
      TRANSCRIPT_DEBUG_EXT: ${TRANSCRIPT_DEBUG_EXT:-}   # limit the dump to one (test) extension
      PGHOST:     "127.0.0.1"
      PGPORT:     "5433"
      PGDATABASE: ${PGDATABASE:-intercom}
      PGUSER:     ${PGUSER:-intercom_user}
      PGPASSWORD: ${PGPASSWORD:?set PGPASSWORD in .env}
    depends_on:
      - pbx-core
      - postgres
    restart: unless-stopped

volumes:
  parley-pgdata:
  parley-tls-certs:
  parley-archives:
